server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single Page App routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets cache
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }

    # Example API proxy (uncomment and set URL)
    # location /api/ {
